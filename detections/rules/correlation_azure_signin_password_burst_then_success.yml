title: Wrong Password Sign-In Attempt
id: a2b4e4f3-820d-41a5-bf98-5cfd712f404c
name: cr_002_wrong_password
status: experimental
description: Building block for CR-002. A Microsoft Entra ID sign-in rejected for a wrong username or password (AADSTS50126).
references:
    - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
author: Radha Prabhakaran
date: 2026-10-16
logsource:
    product: azure
    service: signinlogs
detection:
    selection:
        ResultType: '50126'
    condition: selection
falsepositives:
    - People mistyping their own password. On its own this is noise, which is why only the correlation below alerts.
level: informational
---
title: Successful Sign-In
id: 421efcda-a43f-4584-9325-bb6086846e9e
name: cr_002_signin_success
status: experimental
description: Building block for CR-002. Any successful Microsoft Entra ID sign-in.
references:
    - https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/signinlogs
author: Radha Prabhakaran
date: 2026-10-16
logsource:
    product: azure
    service: signinlogs
detection:
    selection:
        ResultType: '0'
    condition: selection
falsepositives:
    - Every normal sign-in. Never alert on this alone.
level: informational
---
title: Burst Of Wrong Passwords On One Account
id: 3465e858-a160-4f66-b705-dce4185bd42a
name: cr_002_password_burst
status: experimental
description: Building block for CR-002. Five or more wrong-password rejections for the same account within ten minutes.
author: Radha Prabhakaran
date: 2026-10-16
correlation:
    type: event_count
    rules:
        - cr_002_wrong_password
    group-by:
        - UserPrincipalName
    timespan: 10m
    condition:
        gte: 5
level: low
---
title: Burst Of Wrong Passwords Followed By A Successful Sign-In
id: 8ed17706-1b5f-48fa-b551-f84087c10b4a
status: experimental
description: |
    Detects five or more wrong-password rejections on one Microsoft Entra ID account, followed
    within thirty minutes by a successful sign-in to that same account. This is what trying a
    list of leaked or reused passwords against one person looks like when one of them works.
    A single correct guess on the first try leaves no burst; CR-001 covers that case.
references:
    - https://learn.microsoft.com/en-us/entra/identity-platform/reference-error-codes
author: Radha Prabhakaran
date: 2026-10-16
tags:
    - attack.credential-access
    - attack.t1110.004
correlation:
    type: temporal_ordered
    rules:
        - cr_002_password_burst
        - cr_002_signin_success
    group-by:
        - UserPrincipalName
    timespan: 30m
falsepositives:
    - A person who forgot a recently changed password, tried old ones, then got it right. Check whether the success came from their usual device and location.
level: high
chainreaction:
    code: CR-002
    catches: Several wrong passwords on one account, then the right one.
    steps:
        - breach_dump_lookup:3
        - wifi_cafe_takeover:3
        - qr_code_trap:4
