title: Password-Only Sign-In Succeeds From An Unregistered Device
id: a188c664-b2fe-433a-9ba6-74737b1f91e2
related:
    - id: 572b12d4-9062-11ed-a1eb-0242ac120002
      type: similar
status: experimental
description: |
    Detects an interactive Microsoft Entra ID sign-in that succeeded with a password alone, no
    second factor required, from a device that is not registered or joined to the tenant.
    In Chain Reaction this is the step where a captured or reused password turns into an
    account takeover, because nothing else stood in the way.
references:
    - https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/signinlogs
    - https://learn.microsoft.com/en-us/graph/api/resources/devicedetail
author: Radha Prabhakaran
date: 2026-10-16
tags:
    - attack.initial-access
    - attack.persistence
    - attack.privilege-escalation
    - attack.stealth
    - attack.t1078.004
logsource:
    product: azure
    service: signinlogs
detection:
    selection:
        ResultType: '0'
        AuthenticationRequirement: 'singleFactorAuthentication'
        IsInteractive: true
    unregistered_empty:
        DeviceDetail.trustType: ''
    unregistered_missing:
        DeviceDetail.trustType: null
    condition: selection and 1 of unregistered_*
falsepositives:
    - Staff who are not enrolled in MFA yet, signing in from a personal device. That is still the gap this rule exists to show, so review rather than suppress.
    - Break-glass accounts that are deliberately excluded from MFA. Exclude them by UserPrincipalName.
level: medium
chainreaction:
    code: CR-001
    catches: A password that works on its own, typed on a device the company has never seen.
    steps:
        - fake_recruiter_chain:5
        - overshared_workspace:4
        - breach_dump_lookup:4
        - wifi_cafe_takeover:4
        - recovery_email_chain:2
